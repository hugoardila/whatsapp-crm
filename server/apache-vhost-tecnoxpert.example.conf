# Copiá este bloque al VirtualHost SSL que escucha :8988 o :443 (ajustá rutas de certificado).
# Objetivo: el navegador pide https://tecnoxpert.com:PUERTO/api/... y Apache lo manda al Node (PM2).
#
# Requisitos: a2enmod proxy proxy_http proxy_wstunnel ssl headers
#
# NO añadas otra línea tipo ProxyPass /api/cotizacion http://OTRO:... ni /api/cotizaciones →
# el prefijo /api/cotizacion también coincide con /api/cotizaciones-ia-ping y roba rutas al Node equivocado.
# Un solo origen para todo /api (salvo que sepas exactamente qué hacés).

<VirtualHost *:8988>
    ServerName tecnoxpert.com
    SSLEngine on
    SSLCertificateFile "/ruta/tecnoxpert_com.crt"
    SSLCertificateKeyFile "/ruta/tecnoxpert.com.key"

    SSLProxyEngine on
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        /api        http://127.0.0.1:3001/api
    ProxyPassReverse /api        http://127.0.0.1:3001/api
    ProxyPass        /webhook    http://127.0.0.1:3001/webhook
    ProxyPassReverse /webhook    http://127.0.0.1:3001/webhook
    ProxyPass        /socket.io  http://127.0.0.1:3001/socket.io
    ProxyPassReverse /socket.io  http://127.0.0.1:3001/socket.io

    # Panel estático (opción A): DocumentRoot al dist del CRM
    DocumentRoot "/opt/lampp/htdocs/jabru/web/dist"
    <Directory "/opt/lampp/htdocs/jabru/web/dist">
        Require all granted
        Options -Indexes
        FallbackResource /index.html
    </Directory>
</VirtualHost>
